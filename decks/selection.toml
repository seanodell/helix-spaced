deck = "selection"

[[card]]
id = "selection:x"
prompt = "Select the whole current line"
text = "alpha beta\ngamma delta\n"
keys = "x"

[[card]]
id = "selection:xx"
prompt = "Select this line and the one below it"
text = "alpha beta\ngamma delta\nepsilon zeta\n"
keys = "xx"
accept = ["2x"]

[[card]]
id = "selection:select-all"
prompt = "Select the entire file"
text = "alpha beta\ngamma delta\n"
keys = "%"

[[card]]
id = "selection:collapse"
prompt = "Collapse the selection down to just the cursor"
text = "the quick brown fox\n"
start = "x"
keys = ";"

[[card]]
id = "selection:flip"
prompt = "Flip the selection so the cursor sits at the other end"
text = "the quick brown fox\n"
start = "w"
keys = "<A-;>"

[[card]]
id = "selection:extend-mode"
prompt = "Turn on extend mode, then move forward a word so the selection grows"
text = "the quick brown fox\n"
keys = "vw"

[[card]]
id = "selection:extend-line-bounds"
prompt = "Expand the current selection out to whole-line boundaries"
text = "alpha beta\ngamma delta\n"
start = "w"
keys = "X"

[[card]]
id = "selection:copy-cursor-below"
prompt = "Add a second cursor on the line below"
text = "alpha beta\ngamma delta\n"
keys = "C"

[[card]]
id = "selection:keep-primary"
prompt = "Collapse multiple cursors back to just the primary one"
text = "alpha beta\ngamma delta\n"
start = "C"
keys = ","

[[card]]
id = "selection:mi-paren"
prompt = "Select what is inside the parentheses, without the parentheses"
text = "call(alpha, beta) end\n"
start = "ww"
keys = "mi("

[[card]]
id = "selection:ma-paren"
prompt = "Select the parentheses and everything in them"
text = "call(alpha, beta) end\n"
start = "ww"
keys = "ma("

[[card]]
id = "selection:mi-quote"
prompt = "Select the text inside the double quotes"
text = "say \"hi there\" ok\n"
start = "fh"
keys = "mi\""

[[card]]
id = "selection:miw"
prompt = "Select the whole word the cursor is inside"
text = "call(alpha, beta) end\n"
start = "fp"
keys = "miw"

[[card]]
id = "selection:maw"
prompt = "Select the word under the cursor together with the whitespace after it"
text = "alpha beta gamma\n"
start = "w"
keys = "maw"

[[card]]
id = "selection:mi-brace"
prompt = "Select what is inside the curly braces"
text = "cfg = {a: 1, b: 2} done\n"
start = "fa"
keys = "mi{"

[[card]]
id = "selection:mi-bracket"
prompt = "Select what is inside the square brackets"
text = "items = [one, two] done\n"
start = "fo"
keys = "mi["

[[card]]
id = "selection:mi-single-quote"
prompt = "Select the text inside the single quotes"
text = "say 'hi there' ok\n"
start = "fh"
keys = "mi'"

[[card]]
id = "selection:inner-paragraph"
prompt = "Select this whole paragraph, without the blank line after it"
text = "first para\nstill first\n\nsecond para\n"
keys = "mip"

[[card]]
id = "selection:around-paragraph"
prompt = "Select this paragraph including the blank line after it"
text = "first para\nstill first\n\nsecond para\n"
keys = "map"

[[card]]
id = "selection:trim"
prompt = "Trim the whitespace off both ends of the selection"
text = "   padded text   \nnext\n"
start = "x"
keys = "_"

[[card]]
id = "selection:split-on-newline"
prompt = "Split this multi-line selection into one cursor per line"
text = "alpha\nbeta\ngamma\n"
start = "xx"
keys = "<A-s>"

[[card]]
id = "selection:copy-cursor-above"
prompt = "Add a second cursor on the line above"
text = "alpha beta\ngamma delta\n"
start = "j"
keys = "<A-C>"

[[card]]
id = "selection:search-selection"
prompt = "Use the selected word as the search term, then jump to its next occurrence"
text = "one two one two\n"
start = "e"
keys = "*n"

[[card]]
id = "selection:search-prev"
prompt = "Jump to the previous occurrence of the current search term"
text = "one two one two\n"
start = "e*n"
keys = "N"

[[card]]
id = "selection:select-regex"
prompt = "Select the whole file, then narrow to every occurrence of 'a' within it"
text = "alpha beta gamma\n"
keys = "%sa<ret>"

[[card]]
id = "selection:split-regex"
prompt = "Select the whole line, then split it into pieces on every comma"
text = "one,two,three\n"
keys = "xS,<ret>"

[[card]]
id = "selection:search"
prompt = "Search forward for 'gamma'"
text = "alpha beta gamma\n"
keys = "/gamma<ret>"

[[card]]
id = "selection:ma-bracket"
prompt = "Select the square brackets and everything inside them"
text = "items = [one, two] done\n"
start = "fo"
keys = "ma["

[[card]]
id = "selection:ma-brace"
prompt = "Select the curly braces and everything inside them"
text = "cfg = {a: 1, b: 2} done\n"
start = "fa"
keys = "ma{"

[[card]]
id = "selection:ma-quote"
prompt = "Select the double quotes and the text inside them"
text = "say \"hi there\" ok\n"
start = "fh"
keys = "ma\""

[[card]]
id = "selection:ma-single-quote"
prompt = "Select the single quotes and the text inside them"
text = "say 'hi there' ok\n"
start = "fh"
keys = "ma'"
