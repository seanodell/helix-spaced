deck = "files"
kind = "keys"

# Buffer, file and workspace commands. These act on the editor rather than the
# buffer text, so there is no state to compare and they are graded on the keys.
#
# Bindings read from the installed Helix itself: the space-menu infobox, and each
# command's own help popup for the aliases. Only verified aliases are accepted.

[[card]]
id = "files:close-buffer"
prompt = "Close the current file but stay in Helix"
text = "from pathlib import Path\nimport helpers\n"
keys = ":bc<ret>"
accept = [":buffer-close<ret>", ":bclose<ret>"]

[[card]]
id = "files:close-buffer-force"
prompt = "Close the current file without saving, discarding your changes"
text = "from pathlib import Path\nimport helpers\n"
keys = ":bc!<ret>"
accept = [":buffer-close!<ret>", ":bclose!<ret>"]

[[card]]
id = "files:write"
prompt = "Save the current file"
text = "from pathlib import Path\nimport helpers\n"
keys = ":w<ret>"
accept = [":write<ret>"]

[[card]]
id = "files:write-quit"
prompt = "Save the current file and close the view"
text = "from pathlib import Path\nimport helpers\n"
keys = ":wq<ret>"
accept = [":x<ret>", ":write-quit<ret>"]

[[card]]
id = "files:quit"
prompt = "Close the current view, leaving Helix if it is the last one"
text = "from pathlib import Path\nimport helpers\n"
keys = ":q<ret>"
accept = [":quit<ret>"]

[[card]]
id = "files:open"
prompt = "Open src/main.py from disk into this view"
text = "from pathlib import Path\nimport helpers\n"
keys = ":o src/main.py<ret>"
accept = [":open src/main.py<ret>", ":e src/main.py<ret>", ":edit src/main.py<ret>"]

[[card]]
id = "files:buffer-picker"
prompt = "Open the buffer picker to switch between open files"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>b"

[[card]]
id = "files:file-picker"
prompt = "Open the file picker to find a file in the workspace"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>f"

[[card]]
id = "files:command-palette"
prompt = "Open the command palette"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>?"

[[card]]
id = "files:global-search"
prompt = "Search across every file in the workspace"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>/"

[[card]]
id = "files:clipboard-yank"
prompt = "Yank the selection to the system clipboard, not just Helix's register"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>y"

[[card]]
id = "files:clipboard-paste"
prompt = "Paste from the system clipboard after the selection"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>p"

[[card]]
id = "files:symbol-picker"
prompt = "Open the symbol picker for this file"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>s"

[[card]]
id = "files:diagnostics"
prompt = "Open the diagnostic picker to see errors in this file"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>d"

[[card]]
id = "files:hover-docs"
prompt = "Show the documentation for the symbol under the cursor"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>k"

[[card]]
id = "files:rename-symbol"
prompt = "Rename the symbol under the cursor across the project"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>r"

[[card]]
id = "files:code-action"
prompt = "Offer code actions for the current position"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>a"

[[card]]
id = "files:comment-toggle"
prompt = "Comment or uncomment the selected lines"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>c"

[[card]]
id = "files:jumplist-picker"
prompt = "Open the jumplist picker"
text = "from pathlib import Path\nimport helpers\n"
keys = "<space>j"
