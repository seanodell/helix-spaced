deck = "navigation"
kind = "keys"

# Code navigation leans on a language server and a second file, so there is no
# buffer state to compare -- these are graded on the keystrokes. Run
# `hx --health <lang>` if a goto does nothing in real Helix; without a server
# installed these commands fail silently.

[[card]]
id = "nav:goto-definition"
prompt = "Jump to the definition of the symbol under the cursor"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
start = "/helpers.read<ret>"
keys = "gd"

[[card]]
id = "nav:jump-back"
prompt = "Go back to where you were before that jump"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
keys = "<C-o>"

[[card]]
id = "nav:jump-forward"
prompt = "Jump forward again, after having jumped back"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
keys = "<C-i>"
accept = ["<tab>"]

[[card]]
id = "nav:goto-references"
prompt = "List every reference to the symbol under the cursor"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
start = "/load<ret>"
keys = "gr"

[[card]]
id = "nav:goto-implementation"
prompt = "Jump to the implementation of the symbol under the cursor"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
keys = "gi"

[[card]]
id = "nav:goto-type-definition"
prompt = "Jump to the type definition of the symbol under the cursor"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
keys = "gy"

[[card]]
id = "nav:goto-declaration"
prompt = "Jump to the declaration of the symbol under the cursor"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
keys = "gD"

[[card]]
id = "nav:goto-file"
prompt = "Open the file whose path is under the cursor (no language server needed)"
text = "see also: src/helix_spaced/deck.py\nand https://helix-editor.com\n"
start = "/src<ret>"
keys = "gf"

[[card]]
id = "nav:save-jump"
prompt = "Push the current selection onto the jumplist so you can come back to it"
text = "from pathlib import Path\nimport helpers\n\ndef load(name):\n    return helpers.read(Path(name))\n"
keys = "<C-s>"

[[card]]
id = "nav:last-accessed-file"
prompt = "Switch back to the file you were in before this one"
text = "from pathlib import Path\nimport helpers\n"
keys = "ga"

[[card]]
id = "nav:last-modified-file"
prompt = "Jump to the last file you modified"
text = "from pathlib import Path\nimport helpers\n"
keys = "gm"

[[card]]
id = "nav:last-modification"
prompt = "Jump to your last edit within this file"
text = "from pathlib import Path\nimport helpers\n"
keys = "g."

[[card]]
id = "nav:next-buffer"
prompt = "Switch to the next open buffer"
text = "from pathlib import Path\nimport helpers\n"
keys = "gn"

[[card]]
id = "nav:prev-buffer"
prompt = "Switch to the previous open buffer"
text = "from pathlib import Path\nimport helpers\n"
keys = "gp"

[[card]]
id = "nav:label-jump"
prompt = "Jump anywhere on screen using a two-character label"
text = "from pathlib import Path\nimport helpers\n"
keys = "gw"

[[card]]
id = "nav:window-top"
prompt = "Move the cursor to the top of the visible window"
text = "from pathlib import Path\nimport helpers\n"
keys = "gt"

[[card]]
id = "nav:window-center"
prompt = "Move the cursor to the middle of the visible window"
text = "from pathlib import Path\nimport helpers\n"
keys = "gc"

[[card]]
id = "nav:window-bottom"
prompt = "Move the cursor to the bottom of the visible window"
text = "from pathlib import Path\nimport helpers\n"
keys = "gb"

[[card]]
id = "nav:page-down"
prompt = "Scroll down a full page"
text = "line one\nline two\nline three\nline four\n"
keys = "<C-f>"

[[card]]
id = "nav:page-up"
prompt = "Scroll up a full page"
text = "line one\nline two\nline three\nline four\n"
keys = "<C-b>"

[[card]]
id = "nav:half-page-down"
prompt = "Scroll down half a page"
text = "line one\nline two\nline three\nline four\n"
keys = "<C-d>"

[[card]]
id = "nav:half-page-up"
prompt = "Scroll up half a page"
text = "line one\nline two\nline three\nline four\n"
keys = "<C-u>"
