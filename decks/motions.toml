deck = "motions"

[[card]]
id = "motions:w"
prompt = "Move to the start of the next word"
text = "the quick brown fox\n"
keys = "w"

[[card]]
id = "motions:b"
prompt = "Move back to the start of the previous word"
text = "the quick brown fox\n"
start = "ww"
keys = "b"

[[card]]
id = "motions:e"
prompt = "Move to the end of the current word"
text = "the quick brown fox\n"
keys = "e"

[[card]]
id = "motions:W"
prompt = "Move to the next WORD start, treating punctuation as part of the word"
text = "foo_bar baz-qux (nested)\n"
keys = "W"

[[card]]
id = "motions:B"
prompt = "Move back a WORD (punctuation included)"
text = "foo_bar baz-qux (nested)\n"
start = "WW"
keys = "B"

[[card]]
id = "motions:E"
prompt = "Move to the end of the current WORD"
text = "foo_bar baz-qux (nested)\n"
keys = "E"

[[card]]
id = "motions:count-w"
prompt = "Jump forward three words in one command"
text = "the quick brown fox\n"
keys = "3w"

[[card]]
id = "motions:gg"
prompt = "Jump to the start of the file"
text = "alpha beta\ngamma delta\nepsilon zeta\n"
start = "jj"
keys = "gg"

[[card]]
id = "motions:ge"
prompt = "Jump to the last line of the file"
text = "alpha beta\ngamma delta\nepsilon zeta\n"
keys = "ge"

[[card]]
id = "motions:gh"
prompt = "Jump to the start of the line"
text = "alpha beta\ngamma delta\n"
start = "ww"
keys = "gh"

[[card]]
id = "motions:gl"
prompt = "Jump to the end of the line"
text = "alpha beta\ngamma delta\n"
keys = "gl"

[[card]]
id = "motions:gs"
prompt = "Jump to the first non-whitespace character of the line"
text = "    indented line\n"
keys = "gs"

[[card]]
id = "motions:goto-line"
prompt = "Jump to line 2"
text = "alpha beta\ngamma delta\nepsilon zeta\n"
keys = "2G"

[[card]]
id = "motions:f"
prompt = "Select forward up to and including the next 'q'"
text = "the quick brown fox\n"
keys = "fq"

[[card]]
id = "motions:t"
prompt = "Select forward up to but NOT including the next 'q'"
text = "the quick brown fox\n"
keys = "tq"

[[card]]
id = "motions:F"
prompt = "Search backward for 'h' and select back to it"
text = "the quick brown fox\n"
start = "ww"
keys = "Fh"

[[card]]
id = "motions:j"
prompt = "Move down one line"
text = "alpha beta\ngamma delta\nepsilon zeta\n"
keys = "j"

[[card]]
id = "motions:k"
prompt = "Move up one line"
text = "alpha beta\ngamma delta\nepsilon zeta\n"
start = "jj"
keys = "k"

[[card]]
id = "motions:mm"
prompt = "Jump from this bracket to its matching one"
text = "call(alpha, beta) end\n"
start = "f("
keys = "mm"

[[card]]
id = "motions:count-h"
prompt = "Move three characters left in one command"
text = "the quick brown fox\n"
start = "5l"
keys = "3h"

[[card]]
id = "motions:T"
prompt = "Search backward for a space and stop just after it"
text = "the quick brown fox\n"
start = "ww"
keys = "T "

[[card]]
id = "motions:next-paragraph"
prompt = "Select from here to the start of the next paragraph"
text = "first para\nstill first\n\nsecond para\nmore\n"
keys = "]p"

[[card]]
id = "motions:prev-paragraph"
prompt = "Select back to the start of the previous paragraph"
text = "first para\nstill first\n\nsecond para\nmore\n"
start = "]p]p"
keys = "[p"

[[card]]
id = "motions:l"
prompt = "Move one character right"
text = "the quick brown fox\n"
keys = "l"
