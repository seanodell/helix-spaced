deck = "edits"

[[card]]
id = "edits:d"
prompt = "Delete the selection"
text = "the quick brown fox\n"
start = "w"
keys = "d"

[[card]]
id = "edits:c"
prompt = "Delete the selected word and type 'big' in its place, then return to normal mode"
text = "the quick brown fox\n"
start = "w"
keys = "cbig<esc>"

[[card]]
id = "edits:i"
prompt = "Enter insert mode before the cursor, type 'X', then escape"
text = "the quick brown fox\n"
keys = "iX<esc>"

[[card]]
id = "edits:a"
prompt = "Append after the cursor: type 'X', then escape"
text = "the quick brown fox\n"
keys = "aX<esc>"

[[card]]
id = "edits:A"
prompt = "Append at the end of the line: type '!', then escape"
text = "the quick brown fox\n"
keys = "A!<esc>"

[[card]]
id = "edits:o"
prompt = "Open a new line below and type 'next', then escape"
text = "alpha beta\n"
keys = "onext<esc>"

[[card]]
id = "edits:O"
prompt = "Open a new line above and type 'first', then escape"
text = "alpha beta\n"
keys = "Ofirst<esc>"

[[card]]
id = "edits:yank-paste"
prompt = "Yank the first word, jump to the end of the line, and paste it after the cursor"
text = "alpha beta\n"
keys = "wyglp"

[[card]]
id = "edits:paste-before"
prompt = "Yank the first word and paste a copy before the cursor"
text = "alpha beta\n"
keys = "wyP"

[[card]]
id = "edits:replace"
prompt = "Replace the character under the cursor with '-'"
text = "the quick brown fox\n"
keys = "r-"

[[card]]
id = "edits:switch-case"
prompt = "Switch the case of the first word"
text = "the quick brown fox\n"
start = "e"
keys = "~"

[[card]]
id = "edits:join"
prompt = "Join the line below into this one"
text = "alpha beta\ngamma delta\n"
keys = "J"

[[card]]
id = "edits:undo"
prompt = "Delete the whole line, then undo it"
text = "alpha beta\ngamma delta\n"
keys = "xdu"

[[card]]
id = "edits:redo"
prompt = "Delete the line, undo, then redo the delete"
text = "alpha beta\ngamma delta\n"
keys = "xduU"

[[card]]
id = "edits:delete-noyank"
prompt = "Delete the selection WITHOUT copying it to the register"
text = "the quick brown fox\n"
start = "w"
keys = "<A-d>"

[[card]]
id = "edits:surround-add"
prompt = "Wrap the selected word in curly braces"
text = "call alpha end\n"
start = "e"
keys = "ms{"

[[card]]
id = "edits:surround-delete"
prompt = "Remove the parentheses around this text, keeping the text"
text = "call(alpha, beta) end\n"
start = "ww"
keys = "md("

[[card]]
id = "edits:surround-replace"
prompt = "Change the parentheses around this text into curly braces"
text = "call(alpha, beta) end\n"
start = "ww"
keys = "mr({"

[[card]]
id = "edits:I"
prompt = "Insert at the first non-whitespace character of the line: type '!', then escape"
text = "    indented line\n"
keys = "I!<esc>"

[[card]]
id = "edits:indent"
prompt = "Indent this line one level"
text = "  alpha beta\n  gamma\n"
keys = ">"

[[card]]
id = "edits:unindent"
prompt = "Remove one level of indentation from this line"
text = "    alpha beta\n    gamma\n"
keys = "<"

[[card]]
id = "edits:join-select-space"
prompt = "Join the next line up and leave the inserted space selected"
text = "alpha beta\ngamma\n"
keys = "<A-J>"

[[card]]
id = "edits:replace-with-yanked"
prompt = "Yank the first word, then replace the second word with it"
text = "alpha beta gamma\n"
keys = "wywR"

[[card]]
id = "edits:lowercase"
prompt = "Force the selected word to lowercase"
text = "ALPHA beta\n"
start = "e"
keys = "`"

[[card]]
id = "edits:uppercase"
prompt = "Force the selected word to uppercase"
text = "alpha beta\n"
start = "e"
keys = "<A-`>"

[[card]]
id = "edits:repeat-insert"
prompt = "Insert 'X' and escape, then repeat that same insertion once more"
text = "alpha beta\n"
keys = "iX<esc>."

[[card]]
id = "edits:named-register-yank"
prompt = "Yank the first word into register 'a', move on, then paste it back from register 'a'"
text = "alpha beta\n"
keys = "\"aywgl\"ap"

[[card]]
id = "edits:surround-delete-brace"
prompt = "Remove the curly braces around this text, keeping the text"
text = "cfg = {a: 1, b: 2} done\n"
start = "fa"
keys = "md{"

[[card]]
id = "edits:surround-delete-quote"
prompt = "Remove the double quotes around this text, keeping the text"
text = "say \"hi there\" ok\n"
start = "fh"
keys = "md\""

[[card]]
id = "edits:surround-replace-bracket"
prompt = "Change the square brackets around this text into curly braces"
text = "items = [one, two] done\n"
start = "fo"
keys = "mr[{"

[[card]]
id = "edits:surround-add-star"
prompt = "Wrap the selected word in asterisks, the way Markdown emphasis works"
text = "make this bold\n"
start = "wwe"
keys = "ms*"

[[card]]
id = "edits:surround-add-bracket"
prompt = "Wrap the selected word in square brackets"
text = "make this linked\n"
start = "wwe"
keys = "ms["

[[card]]
id = "edits:macro-record-replay"
prompt = "Record a macro that deletes a line, stop recording, then replay it once"
text = "one\ntwo\nthree\nfour\n"
keys = "QxdQq"

[[card]]
id = "edits:macro-word"
prompt = "Record deleting a word, stop recording, then replay it"
text = "alpha beta gamma\n"
keys = "QwdQq"

[[card]]
id = "edits:surround-delete-bracket"
prompt = "Remove the square brackets around this text, keeping the text"
text = "items = [one, two] done\n"
start = "fo"
keys = "md["

[[card]]
id = "edits:surround-replace-paren-bracket"
prompt = "Change the parentheses around this text into square brackets"
text = "call(alpha, beta) end\n"
start = "ww"
keys = "mr(["

[[card]]
id = "edits:surround-replace-brace-paren"
prompt = "Change the curly braces around this text into parentheses"
text = "cfg = {a: 1} done\n"
start = "fa"
keys = "mr{("
